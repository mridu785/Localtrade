<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Buy and sell locally in Assam. Phones, cars, furniture, property and more." />
  <meta name="theme-color" content="#0f766e" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icons/icon.svg" />
  <link rel="stylesheet" href="./css/variables.css" />
  <link rel="stylesheet" href="./css/reset.css" />
  <link rel="stylesheet" href="./css/global.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/home.css" />
  <link rel="stylesheet" href="./css/search.css" />
  <link rel="stylesheet" href="./css/listing.css" />
  <link rel="stylesheet" href="./css/sell.css" />
  <link rel="stylesheet" href="./css/chat.css" />
  <link rel="stylesheet" href="./css/profile.css" />
  <link rel="stylesheet" href="./css/settings.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
  <title>Axom Bazar — Local Marketplace</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("axb:theme") || "system";
        var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>

  <div id="offline-banner" class="offline-banner" hidden>
    You are offline. Browsing cached content only.
  </div>

  <header id="app-header" class="app-header"></header>

  <main id="app" class="app-main" tabindex="-1">
    <div class="page-loader" id="boot-loader">
      <div class="spinner" aria-label="Loading"></div>
    </div>
  </main>

  <nav id="bottom-nav" class="bottom-nav" aria-label="Primary"></nav>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

  <noscript>
    <p style="padding:2rem;text-align:center">This marketplace requires JavaScript.</p>
  </noscript>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
